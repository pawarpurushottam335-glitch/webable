{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<section class="card auth">
  <div class="auth-brand"><img class="logo" src="{{ url_for('static', filename='webable_icon.svg') }}" alt="WebAble logo"><h1>Create Account</h1></div><p class="muted">Join WebAble to analyze website accessibility</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="full_name">Full Name</label>
    <input id="full_name" name="full_name" value="{{ full_name or '' }}" autocomplete="name" required>
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
    <label for="password">Password <small class="muted">(min. 8 characters)</small></label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm Password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn block">Register</button>
  </form>
  <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
