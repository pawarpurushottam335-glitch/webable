{% extends "base.html" %}{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="card auth">
  <div class="auth-brand"><img class="logo" src="{{ url_for('static', filename='webable_icon.svg') }}" alt="WebAble logo"><h1>Reset Password</h1></div>
  <p class="muted">Choose a new password for your account.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">New Password <small class="muted">(min. 8 characters)</small></label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm New Password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button class="btn block">Change Password</button>
  </form>
</section>
{% endblock %}
