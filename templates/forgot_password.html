{% extends "base.html" %}{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="card auth">
  <div class="auth-brand"><img class="logo" src="{{ url_for('static', filename='webable_icon.svg') }}" alt="WebAble logo"><h1>Forgot Password</h1></div>
  <p class="muted">Enter your registered email address. We will send you a link to reset your password.</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
    <button class="btn block">Send Reset Link</button>
  </form>
  <p class="alt"><a href="{{ url_for('login') }}">Back to Login</a></p>
</section>
{% endblock %}
